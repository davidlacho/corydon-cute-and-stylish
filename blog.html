    <!-- Smooth transition script - hide noscript only after React renders -->
    <script>
        (function() {
            // Add smooth transition styles
            const style = document.createElement('style');
            style.id = 'smooth-transition-style';
            style.textContent = `
                noscript {
                    opacity: 1;
                    transition: opacity 0.3s ease-out;
                }
                noscript.fade-out {
                    opacity: 0;
                    pointer-events: none;
                }
                noscript.hidden {
                    display: none !important;
                }
                #root {
                    opacity: 0;
                    transition: opacity 0.3s ease-in;
                }
                #root.react-ready {
                    opacity: 1;
                }
            `;
            document.head.appendChild(style);
            
            // Function to smoothly hide noscript after React is ready
            function hideNoscriptSmoothly() {
                // Find all noscript tags (there may be multiple)
                const noscriptTags = document.querySelectorAll('noscript');
                noscriptTags.forEach(function(noscript) {
                    // Skip the one in head (it only has styles)
                    if (noscript.querySelector('main, #main-content, .blog-hero, .articles-grid')) {
                        // First fade out
                        noscript.classList.add('fade-out');
                        
                        // Then hide completely after transition
                        setTimeout(function() {
                            noscript.style.cssText = 'display: none !important; visibility: hidden !important; height: 0 !important; overflow: hidden !important; position: absolute !important; left: -9999px !important;';
                            const allChildren = noscript.querySelectorAll('*');
                            allChildren.forEach(el => {
                                el.style.cssText = 'display: none !important; visibility: hidden !important; height: 0 !important; overflow: hidden !important;';
                            });
                        }, 300); // Wait for fade transition
                    }
                });
            }
            
            // Store function globally so React can call it when ready
            window.hideNoscriptWhenReady = hideNoscriptSmoothly;
            
            // Also add immediate CSS rule to hide noscript content with main content
            const hideStyle = document.createElement('style');
            hideStyle.id = 'hide-noscript-main';
            hideStyle.textContent = `
                noscript:has(main, #main-content, .blog-hero, .articles-grid) {
                    display: none !important;
                    visibility: hidden !important;
                }
            `;
            // Try modern :has() selector, fallback to manual hiding
            try {
                document.head.appendChild(hideStyle);
            } catch(e) {
                // :has() not supported, use manual approach
                setTimeout(function() {
                    const mainNoscript = Array.from(document.querySelectorAll('noscript')).find(n => 
                        n.querySelector('main, #main-content, .blog-hero, .articles-grid')
                    );
                    if (mainNoscript) {
                        mainNoscript.style.cssText = 'display: none !important; visibility: hidden !important;';
                    }
                }, 0);
            }
        })();
    </script>

    <!-- React App for Blog Listing -->
    <script type="text/javascript" defer>
        // Optimized React initialization with requestIdleCallback to reduce main-thread blocking
        function initBlogApp() {
            if (typeof React !== 'undefined' && typeof ReactDOM !== 'undefined') {
                const { useState, useMemo } = React;

                // Blog Listing App Component
                function BlogApp() {
                    const [filter, setFilter] = useState('all');
                    const [sort, setSort] = useState('date-desc');
                    
                    // Use articles from global ARTICLES_DATA or fallback to empty array
                    const articles = typeof ARTICLES_DATA !== 'undefined' ? ARTICLES_DATA : [];

                    // YYYY-MM-DD in the visitor's local timezone; only posts on or before this day appear
                    const todayLocalISO = useMemo(function () {
                        var d = new Date();
                        var y = d.getFullYear();
                        var m = String(d.getMonth() + 1).padStart(2, '0');
                        var day = String(d.getDate()).padStart(2, '0');
                        return y + '-' + m + '-' + day;
                    }, []);

                    var publishedArticles = useMemo(function () {
                        var isoRe = /^\d{4}-\d{2}-\d{2}$/;
                        return articles.filter(function (a) {
                            if (!a.date || !isoRe.test(a.date)) return true;
                            return a.date <= todayLocalISO;
                        });
                    }, [articles, todayLocalISO]);

                    const filteredAndSorted = useMemo(() => {
                        let filtered = publishedArticles;
                        
                        if (filter !== 'all') {
                            filtered = publishedArticles.filter(a => a.category === filter);
                        }

                        return filtered.sort((a, b) => {
                            if (sort === 'date-desc') {
                                return new Date(b.date) - new Date(a.date);
                            } else if (sort === 'date-asc') {
                                return new Date(a.date) - new Date(b.date);
                            } else if (sort === 'title-asc') {
                                return a.title.localeCompare(b.title);
                            } else if (sort === 'title-desc') {
                                return b.title.localeCompare(a.title);
                            }
                            return 0;
                        });
                    }, [publishedArticles, filter, sort]);

                    const filterText = filter === 'all' ? 'All Posts' : 
                                      filter === 'winnipeg' ? 'Winnipeg Guides' :
                                      filter === 'travel' ? 'Travel Experiences' :
                                      'Hosting & Design';

                    return React.createElement('div', null,
                        React.createElement(Navigation),
                        React.createElement('main', { id: 'main-content' },
                            React.createElement('section', { className: 'blog-hero' },
                                React.createElement('div', { className: 'container' },
                                    React.createElement('h1', null, 'Winnipeg Travel Blog'),
                                    React.createElement('p', null, 'Your complete guide to Winnipeg: local attractions, neighborhoods, restaurants, activities, and insider tips from 14 years of hosting')
                                )
                            ),
                            React.createElement('section', { className: 'blog-content' },
                                React.createElement('div', { className: 'container' },
                                    React.createElement('div', { className: 'blog-intro' },
                                        React.createElement('p', null, "Welcome to our Winnipeg travel blog! Whether you're planning your first visit or looking to discover hidden gems, we've created comprehensive guides to help you make the most of your time in Manitoba's capital. From detailed neighborhood guides and restaurant recommendations to transportation tips and seasonal activities, our blog combines local expertise with insights from 14 years of hosting guests in Winnipeg's historic Crescentwood neighborhood. We also share hosting philosophy, design lessons, and travel stories from our experiences staying in Airbnbs around the world, because great hosting comes from understanding what makes a stay memorable.")),
                                    React.createElement('div', { className: 'blog-controls' },
                                        React.createElement('div', { className: 'filter-sort-container' },
                                            React.createElement('div', { className: 'filter-buttons', role: 'group', 'aria-label': 'Filter blog posts by category' },
                                                React.createElement('button', {
                                                    className: `filter-btn ${filter === 'all' ? 'active' : ''}`,
                                                    'data-filter': 'all',
                                                    'aria-pressed': filter === 'all',
                                                    onClick: () => setFilter('all'),
                                                    onKeyDown: (e) => {
                                                        if (e.key === 'Enter' || e.key === ' ') {
                                                            e.preventDefault();
                                                            setFilter('all');
                                                        }
                                                    }
                                                }, 'All Posts'),
                                                React.createElement('button', {
                                                    className: `filter-btn ${filter === 'winnipeg' ? 'active' : ''}`,
                                                    'data-filter': 'winnipeg',
                                                    'aria-pressed': filter === 'winnipeg',
                                                    onClick: () => setFilter('winnipeg'),
                                                    onKeyDown: (e) => {
                                                        if (e.key === 'Enter' || e.key === ' ') {
                                                            e.preventDefault();
                                                            setFilter('winnipeg');
                                                        }
                                                    }
                                                }, 'Winnipeg Guides'),
                                                React.createElement('button', {
                                                    className: `filter-btn ${filter === 'travel' ? 'active' : ''}`,
                                                    'data-filter': 'travel',
                                                    'aria-pressed': filter === 'travel',
                                                    onClick: () => setFilter('travel'),
                                                    onKeyDown: (e) => {
                                                        if (e.key === 'Enter' || e.key === ' ') {
                                                            e.preventDefault();
                                                            setFilter('travel');
                                                        }
                                                    }
                                                }, 'Travel Experiences'),
                                                React.createElement('button', {
                                                    className: `filter-btn ${filter === 'hosting' ? 'active' : ''}`,
                                                    'data-filter': 'hosting',
                                                    'aria-pressed': filter === 'hosting',
                                                    onClick: () => setFilter('hosting'),
                                                    onKeyDown: (e) => {
                                                        if (e.key === 'Enter' || e.key === ' ') {
                                                            e.preventDefault();
                                                            setFilter('hosting');
                                                        }
                                                    }
                                                }, 'Hosting & Design')
                                            ),
                                            React.createElement('div', { className: 'sort-container' },
                                                React.createElement('label', { htmlFor: 'sort-select' }, 'Sort by:'),
                                                React.createElement('select', {
                                                    id: 'sort-select',
                                                    className: 'sort-select',
                                                    'aria-label': 'Sort blog posts',
                                                    value: sort,
                                                    onChange: (e) => setSort(e.target.value)
                                                },
                                                    React.createElement('option', { value: 'date-desc' }, 'Newest First'),
                                                    React.createElement('option', { value: 'date-asc' }, 'Oldest First'),
                                                    React.createElement('option', { value: 'title-asc' }, 'Title A-Z'),
                                                    React.createElement('option', { value: 'title-desc' }, 'Title Z-A')
                                                )
                                            )
                                        ),
                                        React.createElement('div', {
                                            className: 'results-count',
                                            'aria-live': 'polite'
                                        }, `Showing ${filteredAndSorted.length} ${filteredAndSorted.length === 1 ? 'post' : 'posts'} in ${filterText}`)
                                    ),
                                    React.createElement('div', { className: 'articles-grid' },
                                        filteredAndSorted.map((article, idx) =>
                                            React.createElement('a', {
                                                key: idx,
                                                href: article.url,
                                                className: 'article-card',
                                                'data-category': article.category,
                                                'data-date': article.date,
                                                'data-title': article.title
                                            },
                                                React.createElement('div', { className: 'article-image' },
                                                    React.createElement('img', {
                                                        src: article.image,
                                                        alt: article.imageAlt,
                                                        loading: 'lazy'
                                                    })
                                                ),
                                                React.createElement('div', { className: 'article-content' },
                                                    React.createElement('div', {
                                                        className: 'article-meta',
                                                        dangerouslySetInnerHTML: { __html: article.metaHtml }
                                                    }),
                                                    React.createElement('h2', null, article.title),
                                                    React.createElement('p', null, article.description),
                                                    React.createElement('span', { className: 'read-more' }, 'Read Article')
                                                )
                                            )
                                        )
                                    )
                                )
                            )
                        ),
                        React.createElement(Footer),
                        React.createElement(FloatingBookButton)
                    );
                }
                // Use requestIdleCallback to defer React rendering until browser is idle
                const renderReact = () => {
                    const root = ReactDOM.createRoot(document.getElementById('root'));
                    
                    // Render React app
                    root.render(React.createElement(BlogApp));
                    
                    // After React renders, fade in the root and fade out noscript (defer to next frame)
                    requestAnimationFrame(function() {
                        const rootEl = document.getElementById('root');
                        if (rootEl) {
                            // Fade in React content
                            rootEl.classList.add('react-ready');
                        }
                        
                        // Smoothly hide noscript content
                        if (window.hideNoscriptWhenReady) {
                            window.hideNoscriptWhenReady();
                        }
                        
                        // Also aggressively hide any noscript content that might still be visible
                        const allNoscriptTags = document.querySelectorAll('noscript');
                        allNoscriptTags.forEach(function(noscript) {
                            if (noscript.querySelector('main, #main-content, .blog-hero, .articles-grid')) {
                                noscript.style.cssText = 'display: none !important; visibility: hidden !important; height: 0 !important; overflow: hidden !important; position: absolute !important; left: -9999px !important;';
                                const allChildren = noscript.querySelectorAll('*');
                                allChildren.forEach(el => {
                                    el.style.cssText = 'display: none !important; visibility: hidden !important; height: 0 !important; overflow: hidden !important;';
                                });
                            }
                        });
                        
                        // Also hide any duplicate elements that might appear outside noscript
                        const rootElCheck = document.getElementById('root');
                        if (rootElCheck) {
                            const allElements = document.querySelectorAll('#articles-grid, .blog-controls, .filter-sort-container, .articles-grid, .blog-hero, .blog-content, main#main-content');
                            allElements.forEach(el => {
                                // If element is not inside React root, hide it
                                if (!rootElCheck.contains(el)) {
                                    el.style.cssText = 'display: none !important; visibility: hidden !important; height: 0 !important;';
                                }
                            });
                        }
                    });
                };

                // Defer rendering until idle, with fallback for browsers without requestIdleCallback
                if ('requestIdleCallback' in window) {
                    requestIdleCallback(renderReact, { timeout: 2000 });
                } else {
                    // Fallback: use setTimeout with small delay to allow paint
                    setTimeout(renderReact, 1);
                }
            } else {
                // More efficient polling with exponential backoff
                const maxAttempts = 50;
                const attempt = window._reactLoadAttempt || 0;
                if (attempt < maxAttempts) {
                    window._reactLoadAttempt = attempt + 1;
                    const delay = Math.min(100 * Math.pow(1.1, attempt), 500);
                    setTimeout(initBlogApp, delay);
                }
            }
        }

        // Initialize when DOM is ready, but defer to avoid blocking
        function startInit() {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function() {
                    // Defer initialization slightly to allow initial paint
                    if ('requestIdleCallback' in window) {
                        requestIdleCallback(initBlogApp, { timeout: 1000 });
                    } else {
                        setTimeout(initBlogApp, 0);
                    }
                });
            } else {
                // DOM already ready, defer initialization
                if ('requestIdleCallback' in window) {
                    requestIdleCallback(initBlogApp, { timeout: 1000 });
                } else {
                    setTimeout(initBlogApp, 0);
                }
            }
        }
        startInit();
    </script>
